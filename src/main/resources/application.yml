spring:
  application:
    name: TeamWorkApi
  datasource:
    url: jdbc:mysql://localhost:3306/twApi_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false
    username: root
    password: 12345
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
        ddl-auto: update
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    org:
      springframework:
        security: DEBUG

cloud_name: ${CLOUD_NAME}
api_key: ${API_KEY}
api_secret: ${API_SECRET}



